name: Publish npm module

on:
  repository_dispatch:
    types: [npm-publish]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing native GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Assemble and publish precompiled module
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.tag || inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Download release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          crate_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' tauriless/Cargo.toml | head -n1)
          if [[ "$version" != "$crate_version" ]]; then
            echo "Release $RELEASE_TAG does not match Cargo version $crate_version" >&2
            exit 1
          fi

          mkdir .downloads
          gh release download "$RELEASE_TAG" --dir .downloads \
            --pattern "tauriless-v${version}-windows-x64.dll" \
            --pattern "tauriless-v${version}-macos-x64.dylib" \
            --pattern "tauriless-v${version}-macos-arm64.dylib" \
            --pattern "tauriless-v${version}-linux-x64.so"

          install -Dm755 ".downloads/tauriless-v${version}-windows-x64.dll" \
            npm/native/win32-x64/tauriless.dll
          install -Dm755 ".downloads/tauriless-v${version}-macos-x64.dylib" \
            npm/native/darwin-x64/libtauriless.dylib
          install -Dm755 ".downloads/tauriless-v${version}-macos-arm64.dylib" \
            npm/native/darwin-arm64/libtauriless.dylib
          install -Dm755 ".downloads/tauriless-v${version}-linux-x64.so" \
            npm/native/linux-x64/libtauriless.so
          npm pkg set version="$version" --prefix npm
          npm_version=$(node -p "require('./npm/package.json').version")
          if [[ "$version" != "$npm_version" ]]; then
            echo "npm version $npm_version does not match release $version" >&2
            exit 1
          fi

      - name: Install Linux runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Smoke assembled npm adapter with release binary
        shell: bash
        env:
          TAURILESS_LIBRARY_PATH: ${{ github.workspace }}/npm/native/linux-x64/libtauriless.so
        run: |
          ldd "$TAURILESS_LIBRARY_PATH" | tee .downloads/linux-ldd.txt
          if grep -Fq 'not found' .downloads/linux-ldd.txt; then
            echo 'The staged Linux release binary has unresolved shared libraries' >&2
            exit 1
          fi
          deno eval '
            import { Tauriless } from "./npm/index.js";
            const runtime = new Tauriless();
            const batch = runtime.run(0);
            if (!batch || !Array.isArray(batch.messages)) {
              throw new Error(`invalid Tauriless batch: ${JSON.stringify(batch)}`);
            }
            runtime.close();
            console.log("assembled npm adapter smoke OK");
          '

      - name: Pack and verify npm tarball
        working-directory: npm
        shell: bash
        run: |
          npm pack
          package=$(ls -1 *.tgz)
          contents=$(tar -tzf "$package")
          for required in \
            package/index.js \
            package/index.d.ts \
            package/native/win32-x64/tauriless.dll \
            package/native/darwin-x64/libtauriless.dylib \
            package/native/darwin-arm64/libtauriless.dylib \
            package/native/linux-x64/libtauriless.so
          do
            if ! grep -Fxq "$required" <<<"$contents"; then
              echo "Missing $required from $package" >&2
              exit 1
            fi
          done

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public

      - name: Attach npm tarball to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" npm/*.tgz --clobber
