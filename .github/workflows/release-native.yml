name: Release native binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Create GitHub release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Check tag and crate version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' tauriless/Cargo.toml | head -n1)
          if [[ "$version" != "$crate_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $crate_version" >&2
            exit 1
          fi

      - name: Create release and upload C header
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Tauriless $GITHUB_REF_NAME" \
              --generate-notes
          fi
          cp tauriless/include/tauriless.h "tauriless-v${version}.h"
          gh release upload "$GITHUB_REF_NAME" "tauriless-v${version}.h" --clobber

  windows:
    name: Windows x64 release
    needs: prepare-release
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path tauriless/Cargo.toml --release --locked
      - name: Upload Windows binary to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $asset = "tauriless-v${version}-windows-x64.dll"
          Copy-Item tauriless/target/release/tauriless.dll $asset
          gh release upload $env:GITHUB_REF_NAME $asset --clobber

  macos:
    name: macOS Intel release
    needs: prepare-release
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path tauriless/Cargo.toml --release --locked
      - name: Upload macOS binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="tauriless-v${version}-macos-x64.dylib"
          cp tauriless/target/release/libtauriless.dylib "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

  linux:
    name: Linux x64 release
    needs: prepare-release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - run: cargo build --manifest-path tauriless/Cargo.toml --release --locked
      - name: Upload Linux binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="tauriless-v${version}-linux-x64.so"
          cp tauriless/target/release/libtauriless.so "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

  finalize-release:
    name: Finalize GitHub release
    needs: [windows, macos, linux]
    runs-on: ubuntu-22.04
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir .release
          gh release download "$GITHUB_REF_NAME" --dir .release \
            --pattern "tauriless-v${version}-*" \
            --pattern "tauriless-v${version}.h"
          (cd .release && sha256sum tauriless-* > SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" .release/SHA256SUMS --clobber

      - name: Request npm publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=npm-publish \
            -f "client_payload[tag]=$GITHUB_REF_NAME"
