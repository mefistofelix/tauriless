name: macOS run_for test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Apple Silicon run_for
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Probe repeated bounded native runs
        run: cargo run --manifest-path vendor/tao/Cargo.toml --example run_for_probe -q

      - name: Check Tauriless
        run: cargo check --manifest-path tauriless/Cargo.toml --locked

      - name: Test Tauriless
        run: cargo test --manifest-path tauriless/Cargo.toml --locked
