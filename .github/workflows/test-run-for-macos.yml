name: macOS run_for test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Apple Silicon run_for
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Check out patched Tao dev
        uses: actions/checkout@v7
        with:
          repository: mefistofelix/tao
          ref: dev
          path: tao-src
      - uses: dtolnay/rust-toolchain@stable
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Probe repeated bounded native runs
        run: cargo run --manifest-path tao-src/Cargo.toml --example run_for_probe -q

      - name: Check Tauriless
        run: cargo check --manifest-path tauriless/Cargo.toml --locked

      - name: Build Tauriless dylib
        run: cargo build --manifest-path tauriless/Cargo.toml --locked

      - name: Smoke real Tauri webview with bounded run
        run: deno run --allow-ffi examples/deno_macos_run_for_smoke.js

      - name: Test Tauriless
        run: cargo test --manifest-path tauriless/Cargo.toml --locked
