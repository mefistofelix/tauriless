[package]
name = "tauriless"
description = "A manually-pumped Tauri runtime with a minimal C ABI"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mefistofelix/tauriless"
build = "build.rs"

[lib]
path = "lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5", default-features = false, features = ["wry", "tray-icon", "webview-data-url"] }
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-os = "=2.3.2"
tauri-plugin-positioner = { version = "=2.3.3", features = ["tray-icon"] }
tauri-plugin-store = "=2.4.4"
thiserror = "2.0"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
